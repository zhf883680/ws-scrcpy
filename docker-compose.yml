services:
  ws-scrcpy:
    image: ghcr.io/zhf883680/ws-scrcpy:latest
    container_name: ws-scrcpy
    restart: unless-stopped
    network_mode: host
    environment:
      ADB_DEVICE: ${ADB_DEVICE:-}
      ADB_MDNS_AUTO_CONNECT: ${ADB_MDNS_AUTO_CONNECT:-adb-tls-connect}
    devices:
      - /dev/bus/usb:/dev/bus/usb
    device_cgroup_rules:
      - "c 189:* rwm"
    volumes:
      - adb-keys:/root/.android
    security_opt:
      - no-new-privileges:true

volumes:
  adb-keys:
